    type: float
    initial_value: '0.0'
# Configure the physical pin firing the pump's transistor/MOSFET driver
output:
  - platform: gpio
    pin: GPIO16
    id: pump_pin
  - platform: ledc
    pin: GPIO21
    id: blower_pin  
  - platform: ledc
    pin: GPIO19
    id: glow_plug
  - platform: gpio
    pin: GPIO17
    id: water_pump
    
time:
  - platform: homeassistant
    id: esptime
    
sensor:
  - platform: ads1115
    multiplexer: 'A0_GND'
    gain: 2.048
    update_interval: 3s
    name: "ADS1115 Channel A0-GND"
    id: water_in
    unit_of_measurement: f°
    filters:
      - lambda: |-
          // 1. Establish measured voltage and constants
          float v_out = x; 
          float v_in = 3.3;        // Your input rail voltage
          float r_high = 56000.0;  // 56k fixed resistor
          
          // Prevent divide-by-zero errors if voltage maxes out
          if (v_out >= v_in) {
            return {}; 
          }
          
          // 2. Calculate current thermistor resistance (Low-Side Configuration)
          float r_therm = (v_out * r_high) / (v_in - v_out);
          
          // 3. Beta Equation Parameters (Calibrated to 78.64kR at 46°F)
          float beta = 2515.0;            // Calibrated Beta constant
          float r_nominal = 50000.0;       // 50k Nominal resistance
          float t_nominal = 25.0 + 273.15; // 25°C in Kelvin
          
          // 4. Calculate Temperature in Kelvin
          float temp_k = 1.0 / ((1.0 / t_nominal) + (log(r_therm / r_nominal) / beta));
          
          // 5. Convert Kelvin to Celsius
          float temp_c = temp_k - 273.15;
          
          // 6. Convert Celsius to Fahrenheit
          float temp_f = (temp_c * 9.0 / 5.0) + 32.0;
          
          return temp_f;
  - platform: ads1115
    multiplexer: 'A1_GND'
    gain: 2.048
    update_interval: 3s
    name: "ADS1115 Channel A1-GND"
    id: water_out
    unit_of_measurement: f°
    filters:
      - lambda: |-
          // 1. Establish measured voltage and constants
          float v_out = x; 
          float v_in = 3.3;        // Your input rail voltage
          float r_high = 56000.0;  // 56k fixed resistor
          
          // Prevent divide-by-zero errors if voltage maxes out
          if (v_out >= v_in) {
            return {}; 
          }
          
          // 2. Calculate current thermistor resistance (Low-Side Configuration)
          float r_therm = (v_out * r_high) / (v_in - v_out);
          
          // 3. Beta Equation Parameters (Calibrated to 78.64kR at 46°F)
          float beta = 2515.0;            // Calibrated Beta constant
          float r_nominal = 50000.0;       // 50k Nominal resistance
          float t_nominal = 25.0 + 273.15; // 25°C in Kelvin
          
          // 4. Calculate Temperature in Kelvin
          float temp_k = 1.0 / ((1.0 / t_nominal) + (log(r_therm / r_nominal) / beta));
          
          // 5. Convert Kelvin to Celsius
          float temp_c = temp_k - 273.15;
          
          // 6. Convert Celsius to Fahrenheit
          float temp_f = (temp_c * 9.0 / 5.0) + 32.0;
          
          return temp_f;
  - platform: ads1115
    multiplexer: 'A2_GND'
    gain: 4.096
    update_interval: 3s
    name: "ADS1115 Channel A2-GND"
    id: exhaust_temp
    unit_of_measurement: f°
    filters:
      - lambda: |-
          float v_out = x; 
          float v_in = 3.3;        // Your input rail voltage
          float r_high = 1000.0;   // 1k fixed high-side resistor
          
          if (v_out >= v_in || v_out <= 0.0) {
            return {}; 
          }
          
          // 1. Calculate current sensor resistance (Low-Side)
          float r_sensor = (v_out * r_high) / (v_in - v_out);
          
          // 2. PT1000 Standard Linear Constants
          float r_nominal = 1021.4;       // 1000 Ohms at 32°F (0°C)
          float temp_coefficient = 3.85;  // 3.85 Ohms per 1°C shift
          
          // 3. Calculate Celsius from baseline resistance change
          float temp_c = (r_sensor - r_nominal) / temp_coefficient;
          
          // 4. Convert Celsius to Fahrenheit
          float temp_f = (temp_c * 9.0 / 5.0) + 32.0;
          
          return temp_f;
i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true
ads1115:
  - address: 0x48

# Create a toggle in Home Assistant to start/stop the pump
switch:
  - platform: template
    name: "Diesel Pump State"
    id: pump_enable
    optimistic: true
    turn_on_action: 
      - script.execute: pump_loop
    turn_off_action:
      - output.turn_off: pump_pin
      - script.stop: pump_loop
  - platform: template
    name: "Blower Motor"
    id: blower_enable
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action: 
      - lambda: |-
          id(blower_pin).set_level(id(blower_percent).state);
    turn_off_action:
      - output.turn_off: blower_pin
  - platform: template
    name: "Glow Plug Switch"
    id: glow_plug_swicth
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action: 
      - lambda: |-
          id(glow_plug).set_level(id(glow_plug_freq).state);
    turn_off_action:
      - output.turn_off: blower_pin
  - platform: template
    name: "start has run"
    id: startran
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Water Pump Switch"
    id: water_pump_switch
    optimistic: true
    turn_on_action: 
      - output.turn_on: water_pump
    turn_off_action: 
      - output.turn_off: water_pump
  - platform: template
    name: "Heater State"
    id: heater_state
    optimistic: true
    turn_on_action:
      then:
        - switch.turn_off: startran
        - script.execute: run
    turn_off_action: 
      then:
        - script.execute: shutdown2
  - platform: template
    name: startup
    id: startup
    optimistic: true
    turn_on_action: 
      - script.execute: run
      - script.wait: run

number:
  - platform: template
    name: "Pump Frequency"
    id: pump_hz
    min_value: .2
    max_value: 6.0
    step: 0.1
    initial_value: 1.0
    unit_of_measurement: "Hz"
    optimistic: true
  - platform: template
    name: "Blower percent"
    id: blower_percent
    min_value: 0
    max_value: 1
    step: .1
    initial_value: 1
    unit_of_measurement: "%"
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(blower_pin).set_level(x);
      # need to add a If on
  - platform: template
    name: "Glow Plug Frequency"
    id: glow_plug_freq
    min_value: .0
    max_value: 1
    step: 0.1
    initial_value: 0
    unit_of_measurement: "%"
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(glow_plug).set_level(x);
# Background script handling the precise timing loop
script:
  - id: pump_loop
    mode: restart
    then:
      - delay: 0s
      - while:
          condition:
            all:
              - switch.is_on: pump_enable
              - sensor.in_range:
                  id: exhaust_temp
                  below: 225
          then:
            - logger.log: "pump pump"
            # 1. Turn pump ON
            - output.turn_on: pump_pin
            # 2. Keep ON for exactly 25ms
            - delay: 25ms
            # 3. Turn pump OFF
            - output.turn_off: pump_pin
            # 4. Calculate remaining cycle time dynamically: (1000ms / Hz) - 25ms
            - delay: !lambda |-
                float hz = id(pump_hz).state;
                float total_cycle_ms = 1000.0 / hz;
                float off_time_ms = total_cycle_ms - 25.0;
                return (uint32_t)off_time_ms;

  - id: start_up1
    mode: single
    then:
      - lambda: |-
         id(blower_pin).set_level(1);
         id(glow_plug).set_level(.5);
      - switch.turn_on: blower_enable
      - switch.turn_on: water_pump_switch
      - logger.log: "start up 3"
      - delay: 60s
      - switch.turn_off: blower_enable
  - id: ignitor_start
    mode: single
    then:
      - lambda: id(glow_plug).set_level(1);
      - output.turn_on: glow_plug
      - delay: 10s
  # this is the start script not the run. 
  - id: run
    mode: single
    then:
      - lambda: |- 
          id(ex_temp_now) = id(exhaust_temp).state;
          ESP_LOGI("custom", "The temp set value is: %.2f", id(ex_temp_now));
      - if:
          condition:
            not: 
              switch.is_on: startran  
          then:
            - logger.log: "running"
            - script.execute: start_up1
            - script.wait: start_up1
            - logger.log: "done with start up 1"
            - script.execute: ignitor_start
            - script.wait: ignitor_start
            - logger.log: "done with ignitor"
            - lambda: |-
                id(blower_pin).set_level(1);
            #    id(pump_hz).make_call().set_value(2.0).perform();
            - switch.turn_on: pump_enable      
            - delay: 10s
            - logger.log: "rolling"
                # check exhaust temps if we are in business then run on settings
                # now figure out power settings and mathcing fan and pump settings
            - lambda: |-
                if( id(ex_temp_now) > ((id(exhaust_temp).state) + 10.0)){
                  id(glow_plug).set_level(0);
