                 }
               #     id(pump_hz).state = round(1.0f + (((id(heater_power).state) - 1.0f) * 5.0f) / 9.0f);

                
         #      id(pump_hz).make_call().set_value(1.0).perform();
         #      id(pump_loop).execute();
          # find the level
        #  // float level = id(heater_power).state * .1;
         # //id(blower_pin).set_level(level);
        
      # do some translation for diesel pump
